<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>和のん おたより管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@700&display=swap');
:root{--ac:#8a6f3f;--bg:#f4f0e8;--card:#fff;--line:#e5ddcc;--text:#33302a;--muted:#8a8172;--brand:#8f7c5b;--pub:#5f7d3e;--pri:#b07b32}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:#241a0e;color:#f0e2c4;display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
header h1{font-size:15px;margin:0;font-weight:900;font-family:"Zen Maru Gothic"}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(60,45,20,.06)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:700}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--text)}
textarea{min-height:70px;resize:vertical;line-height:1.7}
.btn{border:none;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-main{background:linear-gradient(135deg,#c9a24e,#9a7a2f);color:#241a0e;width:100%}
.btn-sm{background:#efe8da;color:var(--text);padding:8px 13px;font-size:12.5px;border-radius:9px}
.btn-del{background:#fdecea;color:#c0392b}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.badge{display:inline-block;font-size:10.5px;border-radius:6px;padding:2px 8px;font-weight:800;margin-left:6px}
.badge.pub{background:#e7f0e0;color:var(--pub)}
.badge.pri{background:#f5e7d3;color:var(--pri)}
.badge.new{background:#fbe4dd;color:#c0392b}
.m-name{font-weight:700;font-size:14px}
.m-date{font-size:11px;color:var(--muted);margin:3px 0 0}
.m-text{font-size:14px;white-space:pre-wrap;line-height:1.7;margin:9px 0 0;background:#faf7f0;border-radius:10px;padding:11px 12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:8px}
.toggle input{width:18px;height:18px}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.status{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-top:10px;display:none}
.status.ok{display:block;background:#e6f5ea;color:#1e7a3a}.status.err{display:block;background:#fdecea;color:#c0392b}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:700;color:var(--muted)}
.chip.on{background:#241a0e;color:#f0e2c4;border-color:#241a0e}
.saved{font-size:11.5px;color:var(--pub);margin-left:8px;display:none}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
a{color:var(--ac)}
</style></head>
<body>
<header><h1>和のん おたより管理</h1><button class="btn btn-ghost" id="btnOut" style="display:none">ログアウト</button></header>
<div class="wrap">

  <!-- 未設定 -->
  <div class="card" id="noCfg" style="display:none">
    <p class="hint">まだFirebaseの設定が入っていません。アプリの <b>config.json</b> の <b>messages.firebase</b> に設定を入れて保存してください。設定後にこのページを再読み込みするとログイン画面が表示されます。</p>
  </div>

  <!-- ログイン -->
  <div class="card" id="loginCard" style="display:none">
    <h2 style="margin:0 0 4px;font-size:16px;font-family:'Zen Maru Gothic'">お店の方 ログイン</h2>
    <p class="hint">Firebaseに登録したお店のメールアドレスとパスワードでログインしてください。</p>
    <label>メールアドレス</label><input type="email" id="email" autocomplete="username">
    <label>パスワード</label><input type="password" id="pw" autocomplete="current-password">
    <div style="margin-top:14px"><button class="btn btn-main" id="btnIn">ログイン</button></div>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- 一覧 -->
  <div id="board" style="display:none">
    <div class="filters">
      <button class="chip on" data-f="all">すべて</button>
      <button class="chip" data-f="new">未返信</button>
      <button class="chip" data-f="pub">公開</button>
      <button class="chip" data-f="pri">非公開</button>
    </div>
    <div id="list"></div>
    <div class="empty" id="empty" style="display:none">まだメッセージはありません。</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var db=null,auth=null,ALL=[],FILTER='all';

fetch('config.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(cfg){
  var fb=cfg&&cfg.messages&&cfg.messages.firebase;
  if(!fb||!fb.apiKey||!fb.projectId){$('noCfg').style.display='';return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(fb);
    db=firebase.firestore();auth=firebase.auth();
    auth.onAuthStateChanged(function(u){
      if(u){$('loginCard').style.display='none';$('board').style.display='';$('btnOut').style.display='';load();}
      else{$('loginCard').style.display='';$('board').style.display='none';$('btnOut').style.display='none';}
    });
  }catch(e){$('noCfg').style.display='';}
}).catch(function(){$('noCfg').style.display='';});

$('btnIn').onclick=function(){
  var em=$('email').value.trim(),pw=$('pw').value;
  if(!em||!pw){setStatus('loginStatus','err','メールとパスワードを入力してください。');return;}
  $('btnIn').disabled=true;
  auth.signInWithEmailAndPassword(em,pw).then(function(){$('pw').value='';})
    .catch(function(e){setStatus('loginStatus','err','ログインできませんでした（'+(e.code||'')+'）。メール・パスワードをご確認ください。');})
    .then(function(){$('btnIn').disabled=false;});
};
$('btnOut').onclick=function(){auth.signOut();};
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});c.classList.add('on');FILTER=c.getAttribute('data-f');render();};});

function setStatus(id,cls,msg){var e=$(id);e.className='status '+cls;e.textContent=msg;}
function tsN(ts){try{return ts&&ts.toDate?ts.toDate().getTime():0;}catch(e){return 0;}}
function fmt(ts){try{var d=ts&&ts.toDate?ts.toDate():null;if(!d)return '';var p=function(n){return('0'+n).slice(-2);};return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return '';}}

function load(){
  db.collection('messages').get().then(function(qs){
    ALL=[];qs.forEach(function(d){ALL.push(Object.assign({__id:d.id},d.data()));});
    ALL.sort(function(a,b){return tsN(b.createdAt)-tsN(a.createdAt);});
    render();
  }).catch(function(e){$('list').innerHTML='<div class="card">読み込みに失敗しました（'+esc(e.code||'')+'）。セキュリティルールをご確認ください。</div>';});
}

function render(){
  var arr=ALL.filter(function(m){
    if(FILTER==='new')return !m.reply;
    if(FILTER==='pub')return m.isPublic;
    if(FILTER==='pri')return !m.isPublic;
    return true;
  });
  $('empty').style.display=arr.length?'none':'';
  $('list').innerHTML=arr.map(function(m){
    var badge=m.isPublic?'<span class="badge pub">公開希望</span>':'<span class="badge pri">非公開</span>';
    var isnew=!m.reply?'<span class="badge new">未返信</span>':'';
    var shownChk='<label class="toggle"><input type="checkbox" class="shownck" data-id="'+m.__id+'"'+(m.shown?' checked':'')+(m.isPublic?'':' disabled')+'>公開ボードに掲載する'+(m.isPublic?'':'（お客様が非公開を選択）')+'</label>';
    return '<div class="card">'+
      '<div class="m-name">'+esc(m.name||'ゲスト')+badge+isnew+'</div>'+
      '<div class="m-date">'+fmt(m.createdAt)+'</div>'+
      '<div class="m-text">'+esc(m.text)+'</div>'+
      '<label>お店からの返信</label><textarea class="rep" data-id="'+m.__id+'" placeholder="返信を入力">'+esc(m.reply||'')+'</textarea>'+
      shownChk+
      '<div class="row"><button class="btn btn-sm save" data-id="'+m.__id+'">返信を保存</button><span class="saved" id="sv_'+m.__id+'">保存しました</span><button class="btn btn-sm btn-del del" data-id="'+m.__id+'" style="margin-left:auto">削除</button></div>'+
      '</div>';
  }).join('');
  // bind
  $('list').querySelectorAll('.save').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-id');
    var rep=$('list').querySelector('.rep[data-id="'+id+'"]').value.trim();
    var ck=$('list').querySelector('.shownck[data-id="'+id+'"]');
    var shown=!!(ck&&ck.checked&&!ck.disabled);
    b.disabled=true;
    db.collection('messages').doc(id).update({reply:rep,shown:shown,repliedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .then(function(){var s=$('sv_'+id);if(s){s.style.display='inline';setTimeout(function(){s.style.display='none';},1800);}
        var m=ALL.filter(function(x){return x.__id===id;})[0];if(m){m.reply=rep;m.shown=shown;}})
      .catch(function(e){alert('保存に失敗しました（'+(e.code||'')+'）');})
      .then(function(){b.disabled=false;});
  };});
  $('list').querySelectorAll('.del').forEach(function(b){b.onclick=function(){
    var id=b.getAttribute('data-id');
    if(!confirm('このメッセージを削除しますか？（元に戻せません）'))return;
    db.collection('messages').doc(id).delete().then(function(){ALL=ALL.filter(function(x){return x.__id!==id;});render();})
      .catch(function(e){alert('削除に失敗しました（'+(e.code||'')+'）');});
  };});
}
</script>
</body></html>
